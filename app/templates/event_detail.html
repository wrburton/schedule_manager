{% extends "base.html" %}

{% block title %}{{ event.title }}{% endblock %}

{% block content %}
<p class="page-breadcrumb"><a href="{{ rp(request) }}/events/upcoming">← Back to upcoming</a></p>

{% include "_event_detail_card.html" %}

<div class="meta-note">
  <p>Last synced: {{ event.last_synced.strftime('%b %d, %Y at %I:%M %p') }}</p>
  <p>Google event ID: {{ event.google_event_id }}</p>
</div>
{% endblock %}
